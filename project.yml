name: SunnyWalker
options:
  bundleIdPrefix: app.rexcode   # App Store identity (team NHY8MKW8NH / WU RUEI-YI) — see docs/for_Apple_store/IDENTIFIERS.md
  deploymentTarget:
    iOS: "26.0"   # AlarmKit requires iOS 26 (pbxproj already targets 26.0; keep xcodegen in sync)
  developmentLanguage: zh-Hant
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Version scheme aligned with Lode (Mac App Store): marketing = MAJOR.MINOR.YYYYMMDD,
    # build = monotonically-increasing integer (CFBundleVersion). The date segment is the
    # archive date; bump it (and the build int) on every re-upload — App Store rejects
    # duplicate build numbers. ⚠️ Update 20260610 to the actual archive date before Archive.
    MARKETING_VERSION: "1.0.20260610"
    CURRENT_PROJECT_VERSION: 4   # bump on every upload (App Store rejects duplicate build numbers)
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: NHY8MKW8NH   # RUEI YI WU — see docs/for_Apple_store/IDENTIFIERS.md

# Swift Package dependencies. MUST be declared here — otherwise `xcodegen generate`
# regenerates the .pbxproj without them and the build fails with undefined symbols
# (e.g. ConfettiSwiftUI's confettiCannon / ConfettiType).
packages:
  ConfettiSwiftUI:
    url: https://github.com/simibac/ConfettiSwiftUI
    from: 1.1.0

targets:
  SunnyWalker:
    type: application
    platform: iOS
    sources:
      - path: SunnyWalker
    dependencies:
      - package: ConfettiSwiftUI
    info:
      path: SunnyWalker/Info.plist
      properties:
        CFBundleDisplayName: SunnyWalker
        # Version strings MUST live here — xcodegen regenerates Info.plist from info.properties and
        # resets anything not listed to its own defaults (that's why a hand-edited CFBundleVersion
        # kept reverting to "1"). Build number is driven by CURRENT_PROJECT_VERSION so re-uploads
        # only need that one number bumped (App Store rejects duplicate build numbers).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # No export-controlled encryption → declare exempt so Xcode/Organizer never prompts on upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        NSAlarmKitUsageDescription: "SunnyWalker 需要鬧鐘權限，才能在鎖屏和靜音模式下叫醒小朋友。"
        NSMicrophoneUsageDescription: "鬧鐘需要聽你說「我起床了」才能關掉喔！聲音只留在這台 iPhone 裡，不會傳出去。"
        NSSpeechRecognitionUsageDescription: "用來聽懂你說的話，把鬧鐘關掉。所有辨識都在這台裝置上完成。"
        UIBackgroundModes:
          - audio
          - processing   # BGProcessingTask — AlarmAutoStopService Layer 1（背景自動停鈴保險）
        # ⚠️ 必須在這裡宣告，否則 `xcodegen generate` 會用 info.properties 重建 Info.plist，
        # 把手改的 BGTaskSchedulerPermittedIdentifiers 洗掉 → BGTaskScheduler.register 直接 crash。
        BGTaskSchedulerPermittedIdentifiers:
          - com.sunnywalker.alarm.autostop
        # iPad multitasking rule (App Store error 90474): a universal app must EITHER declare all
        # four orientations OR require full screen. SunnyWalker is portrait-locked, so we require
        # full screen (no iPad split-view) instead of adding landscape we don't support.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rexcode.sunnywalker
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # NOTE: AlarmKit needs NO entitlement — only NSAlarmKitUsageDescription (in info.properties).
        # com.apple.developer.alarmkit is NOT a real/provisionable entitlement (absent from the
        # Developer Portal); putting it in an entitlements file makes automatic signing fail with
        # "Entitlement com.apple.developer.alarmkit not found and could not be included in profile".
        # So we deliberately do NOT set CODE_SIGN_ENTITLEMENTS.
  SunnyWalkerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SunnyWalkerTests
    dependencies:
      - target: SunnyWalker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.rexcode.sunnywalkertests
